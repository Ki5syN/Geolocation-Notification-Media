<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HelpDesk</title>
  </head>
  <body>
    <div id="root" class="widget">
      <div class="timeline"></div>      
      <form action="" class="formBox">     
        <textarea class="form-input" rows="3"></textarea>
        <div class="form-buttonBox">
          <button type='button' class='video form-button'>
            <svg class="icon"><use href="sprites.svg#icon-video"></use></svg>
          </button>
          <button type='button' class='audio form-button'>            
            <svg class="icon"><use href="sprites.svg#icon-audio"></use></svg>
          </button>
        </div>        
      </form>          
    </div>
  </body>
</html>
